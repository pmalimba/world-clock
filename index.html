<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Clock - Paula Malimba</title>
    <link rel="stylesheet" href="src/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.20.1/moment.min.js"></script>
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/moment-timezone/0.5.37/moment-timezone-with-data-1970-2030.min.js"></script>
</head>

<body>
    <div class="container">
        <h1>World Clock</h1>
        <select>
            <option value="">Select a city...</option>
            <option value="">Amsterdam</option>
            <option value="">Melbourne</option>
            <option value="">Cape Town</option>
            <option value="">Singapour</option>
        </select>
        <div class="city" id="the-hague">
            <div>
                <h2>The Hague 🇳🇱</h2>
                <div class="date">April 9th 2025</div>
            </div>
            <div>
                <div class="time">18:22:00 <small>PM</small></div>
            </div>
        </div>
        <div class="city" id="auckland">
            <div>
                <h2>Auckland 🇳🇿</h2>
                <div class="date">April 9th 2025</div>
            </div>
            <div>
                <div class="time">18:22:00 <small>PM</small></div>
            </div>
        </div>
        <script src="javascript/index.js"></script>
    </div>
    <footer>
        This project was coded with ❤️ by <strong>Paula Malimba</strong>
        and is <a href="#" target="_blank">open-sourced on GitHub></a>
        and is <a href="#" target="_blank">hosted on Netlify</a>
    </footer>
</body>

</html>
