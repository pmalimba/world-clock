<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Clock - Paula Malimba</title>
    <link rel="stylesheet" href="src/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.20.1/moment.min.js"></script>
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/moment-timezone/0.5.37/moment-timezone-with-data-1970-2030.min.js"></script>
</head>

<body>
    <div class="container">
        <h1>World Clock</h1>
        <select id="city">
            <option value="">Select a city...</option>
            <option value="current">My current location</option>
            <option value="Australia/Melbourne">Melbourne</option>
            <option value="Africa/Johannesburg">Johannesburg</option>
            <option value="Europe/Tallinn">Tallinn</option>
        </select>

        <div id="cities">
            <div class="city" id="the-hague">
                <div>
                    <h2>The Hague 🇳🇱</h2>
                    <div class="date"></div>
                </div>
                <div>
                    <div class="time"><small>PM</small></div>
                </div>
            </div>
            <div class="city" id="auckland">
                <div>
                    <h2>Auckland 🇳🇿</h2>
                    <div class="date"></div>
                </div>
                <div>
                    <div class="time"><small>PM</small></div>
                </div>
            </div>
        </div>
    </div>
    <footer>
        This project was coded with ❤️ by <strong>Paula Malimba</strong>
        and is <a href="#" target="_blank">open-sourced on GitHub></a>
        and is <a href="#" target="_blank">hosted on Netlify</a>
    </footer>
    <script src="javascript/index.js"></script>
</body>

</html>
